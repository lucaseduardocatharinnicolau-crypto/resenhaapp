name: Publicar versão

# Como publicar uma versão nova:
#   1. mude "version" no package.json (ex.: 1.3.0)
#   2. git commit -am "v1.3.0" && git tag v1.3.0 && git push && git push --tags
# O GitHub gera o Resenha.exe (Windows) e os .zip do Mac e cria a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gerar Resenha.exe
        run: npx electron-builder --win portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: win
          path: dist/Resenha.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Gerar Resenha.app (Apple Silicon e Intel), assinatura ad-hoc (sem conta paga da Apple)
        run: npx electron-builder --mac dir --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Compactar
        run: |
          ls dist
          ditto -c -k --keepParent dist/mac-arm64/Resenha.app dist/Resenha-mac-apple.zip
          ditto -c -k --keepParent dist/mac/Resenha.app dist/Resenha-mac-intel.zip
          codesign -dv dist/mac-arm64/Resenha.app || true
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/Resenha-mac-*.zip

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Criar release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Resenha.exe
            out/Resenha-mac-apple.zip
            out/Resenha-mac-intel.zip
          generate_release_notes: true
